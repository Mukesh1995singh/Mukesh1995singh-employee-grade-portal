microservice:
  name: employee-grade-portal
  namespace: grade-portal
  replicas: 2

frontend:
  image: employee-grade-frontend:1.0
  port: 5001

  service:
    type: ClusterIP
    port: 5001
    targetPort: 5001

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

backend:
  image: employee-grade-api:1.0
  port: 3000

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  livenessDelay: 15

env:
  APP_ENV: dev

ingress:
  enabled: true
  className: traefik

  hosts:
    - host: employee-grade-dev.local
      paths:
        - path: /api
          pathType: Prefix
        - path: /
          pathType: Prefix

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70