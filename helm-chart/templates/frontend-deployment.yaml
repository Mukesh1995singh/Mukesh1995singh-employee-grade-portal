apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ .Values.microservice.name }}-frontend
  namespace: {{ .Values.microservice.namespace }}
  labels:
    app: {{ .Values.microservice.name }}-frontend

spec:
  replicas: {{ .Values.microservice.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.microservice.name }}-frontend

  template:
    metadata:
      labels:
        app: {{ .Values.microservice.name }}-frontend

    spec:
      containers:
        - name: frontend

          image: {{ .Values.frontend.image }}
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP

          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20