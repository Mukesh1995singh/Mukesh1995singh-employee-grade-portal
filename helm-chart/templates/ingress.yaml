{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: {{ .Values.microservice.name }}-ingress
  namespace: {{ .Values.microservice.namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.microservice.name }}-{{ if eq .path "/api" }}backend{{ else }}frontend{{ end }}
                port:
                  number: {{ if eq .path "/api" }}{{ $.Values.backend.port }}{{ else }}{{ $.Values.frontend.port }}{{ end }}
          {{- end }}
    {{- end }}

{{- end }}